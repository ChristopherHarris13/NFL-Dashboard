name: gridironops
version: "1.0.0"
profile: gridironops

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # The mocks' simulated calendar (docker-compose.yml SIM_START_DATE): week 1 = training camp.
  sim_start_date: "2026-07-20"
  sim_end_date: "2027-07-31"
  # ACWR bands (Gabbett): low <0.8, sweet 0.8-1.3, elevated 1.3-1.5, high >1.5
  acwr_low: 0.8
  acwr_sweet_high: 1.3
  acwr_elevated_high: 1.5

models:
  gridironops:
    +materialized: table
    staging:
      +materialized: view
      +schema: silver      # unpacked nflverse feeds live next to the other Silver views
    dims:
      +schema: gold
    facts:
      +schema: gold
    marts:
      +schema: gold

seeds:
  gridironops:
    +schema: gold
    stadiums:
      +column_types: {latitude: numeric, longitude: numeric, is_dome: boolean}

snapshots:
  gridironops:
    +schema: gold
