services:
  catapult_svc:
    build:
      context: ./mock_vendors
      dockerfile: catapult_svc/Dockerfile
    ports: ["8001:8001"]
    environment: &sim_env
      GEN_INTERVAL_SECONDS: "300"
      BACKFILL_DAYS: "45"
      SIM_START_DATE: "2026-07-20"
      SCHEMA_DRIFT_DATE: "2026-09-01"
      SCALE_CHANGE_DATE: "2026-08-25"
      SEED_TEAM: "KC"
      GLOBAL_SEED: "gridironops"
      # Optional: pin the wall-clock anchor so containers restarted on a
      # different UTC day still agree on the simulated date.
      # SIM_WALL_EPOCH: "2026-09-15T00:00:00Z"

  forcedeck_svc:
    build:
      context: ./mock_vendors
      dockerfile: forcedeck_svc/Dockerfile
    ports: ["8002:8002"]
    environment: *sim_env

  ams_wellness_svc:
    build:
      context: ./mock_vendors
      dockerfile: ams_wellness_svc/Dockerfile
    ports: ["8003:8003"]
    environment: *sim_env

  nutrition_svc:
    build:
      context: ./mock_vendors
      dockerfile: nutrition_svc/Dockerfile
    ports: ["8004:8004"]
    environment: *sim_env

  emr_svc:
    build:
      context: ./mock_vendors
      dockerfile: emr_svc/Dockerfile
    ports: ["8005:8005"]
    environment: *sim_env

  # ---------------------------------------------------------------------------
  # Warehouse: one Postgres with two databases — `warehouse` (bronze/silver/
  # gold/meta schemas, see warehouse/init/) and `airflow` (scheduler metadata).
  # Init scripts only run on an empty volume; `docker compose down -v` resets.
  # ---------------------------------------------------------------------------
  warehouse:
    image: postgres:17.9-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}
      POSTGRES_USER: ${WAREHOUSE_USER:-warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-warehouse} -d ${WAREHOUSE_DB:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # Airflow 3 in standalone mode: api-server + scheduler + dag-processor +
  # triggerer in one container, LocalExecutor, metadata in the warehouse
  # container's `airflow` DB. UI on http://localhost:8080 (no login locally).
  # ---------------------------------------------------------------------------
  airflow:
    build: ./airflow
    command: standalone
    ports: ["8080:8080"]
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@warehouse:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-local-only}
      # Connection id "warehouse" used by DAGs (PostgresHook / SQL operators)
      AIRFLOW_CONN_WAREHOUSE: postgresql://${WAREHOUSE_USER:-warehouse}:${WAREHOUSE_PASSWORD:-warehouse}@warehouse:5432/${WAREHOUSE_DB:-warehouse}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - airflow_logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  warehouse_data:
  airflow_logs:
