services:
  catapult_svc:
    build:
      context: ./mock_vendors
      dockerfile: catapult_svc/Dockerfile
    ports: ["8001:8001"]
    environment: &sim_env
      GEN_INTERVAL_SECONDS: "300"
      BACKFILL_DAYS: "45"
      SIM_START_DATE: "2026-07-20"
      SCHEMA_DRIFT_DATE: "2026-09-01"
      SCALE_CHANGE_DATE: "2026-08-25"
      SEED_TEAM: "NE"
      GLOBAL_SEED: "gridironops"
      # Optional: pin the wall-clock anchor so containers restarted on a
      # different UTC day still agree on the simulated date.
      # SIM_WALL_EPOCH: "2026-09-15T00:00:00Z"

  forcedeck_svc:
    build:
      context: ./mock_vendors
      dockerfile: forcedeck_svc/Dockerfile
    ports: ["8002:8002"]
    environment: *sim_env

  ams_wellness_svc:
    build:
      context: ./mock_vendors
      dockerfile: ams_wellness_svc/Dockerfile
    ports: ["8003:8003"]
    environment: *sim_env

  nutrition_svc:
    build:
      context: ./mock_vendors
      dockerfile: nutrition_svc/Dockerfile
    ports: ["8004:8004"]
    environment: *sim_env

  emr_svc:
    build:
      context: ./mock_vendors
      dockerfile: emr_svc/Dockerfile
    ports: ["8005:8005"]
    environment: *sim_env

  # ---------------------------------------------------------------------------
  # Warehouse: the medallion Postgres. warehouse/init/ runs once on an empty
  # volume and creates bronze/silver/gold + the generic bronze.<source> tables.
  # ---------------------------------------------------------------------------
  warehouse:
    image: postgres:17.9-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}
      POSTGRES_USER: ${WAREHOUSE_USER:-warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-warehouse} -d ${WAREHOUSE_DB:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Airflow's own metadata DB — separate instance, not exposed on the host.
  airflow_db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow} -d ${AIRFLOW_DB_NAME:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # Airflow 2.11 `standalone` (webserver + scheduler + triggerer in one
  # container), LocalExecutor. UI http://localhost:8080, login admin/admin.
  # ---------------------------------------------------------------------------
  airflow:
    build: ./airflow
    command: standalone
    ports: ["8080:8080"]
    depends_on:
      airflow_db:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow_db:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-local-only}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      # Image entrypoint: migrate the metadata DB and create the admin login
      # before `standalone` starts, so the password is known (not generated).
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      # Connection id "warehouse" used by the extract plugin / PostgresHook
      AIRFLOW_CONN_WAREHOUSE: postgresql://${WAREHOUSE_USER:-warehouse}:${WAREHOUSE_PASSWORD:-warehouse}@warehouse:5432/${WAREHOUSE_DB:-warehouse}
      # dbt (dbt/profiles.yml reads DATABASE_URL)
      DATABASE_URL: postgresql://${WAREHOUSE_USER:-warehouse}:${WAREHOUSE_PASSWORD:-warehouse}@warehouse:5432/${WAREHOUSE_DB:-warehouse}
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_PROJECT_DIR: /opt/airflow/dbt
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./warehouse:/opt/airflow/warehouse:ro
      - ./great_expectations:/opt/airflow/great_expectations:ro
      - ./dbt:/opt/airflow/dbt
      - airflow_logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

volumes:
  warehouse_data:
  airflow_db_data:
  airflow_logs:
